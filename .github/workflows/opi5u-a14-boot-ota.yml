name: OPi5U A14 KernelSU Cloud Build

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}
  TARGET_FILES_TAG: opi5u-a14-rkr8-target-files-v1
  OTA_TOOLS_URL: https://github.com/t3st0st3r0n4s/FE-kernel-rockchip/releases/download/opi5u-a14-otatools-v1/otatools.zip
  OTA_TOOLS_SHA256: c30aa81a4abfa14e4f18c81e50036351525e3757666fe2d2d73795cbbe449f1c
  CLANG_SOURCE_COMMIT: 084bfeee4305d1572309b4ac279a4125f6c7fa5e
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '5'
  KBUILD_BUILD_TIMESTAMP: ''

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out canonical kernel and pinned KernelSU Next
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install kernel build prerequisites
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev unzip curl ccache

      - name: Restore pinned Google Clang from GitHub cache
        id: clang-cache
        uses: actions/cache@v5
        with:
          path: aosp-clang/clang-r487747c
          key: ${{ runner.os }}-opi5u-a14-clang-r487747c-084bfeee4305d157-v1

      - name: Fetch official Android 14 Clang r487747c
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            --branch android-14.0.0_r40 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            aosp-clang
          test "$(git -C aosp-clang rev-parse HEAD)" = "$CLANG_SOURCE_COMMIT"
          git -C aosp-clang sparse-checkout set clang-r487747c
          test -x aosp-clang/clang-r487747c/bin/clang

      - name: Verify cached or downloaded Clang
        shell: bash
        run: |
          set -euo pipefail
          test -x aosp-clang/clang-r487747c/bin/clang
          echo "$GITHUB_WORKSPACE/aosp-clang/clang-r487747c/bin" >> "$GITHUB_PATH"
          aosp-clang/clang-r487747c/bin/clang --version | head -2

      - name: Restore reusable kernel compilation cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-opi5u-a14-ccache-r487747c-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-opi5u-a14-ccache-r487747c-v1-

      - name: Compile OPi5U Android 14 kernel with built-in KernelSU
        shell: bash
        run: |
          set -euo pipefail
          git submodule status KernelSU-Next
          test -f KernelSU-Next/kernel/Kbuild
          git -C KernelSU-Next fetch --depth=1 --tags origin
          ccache --zero-stats
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC="ccache clang" opi5u_android_defconfig
          grep -qx 'CONFIG_KSU=y' .config
          make -j4 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC="ccache clang" Image
          ccache --show-stats
          test -s arch/arm64/boot/Image
          mkdir -p cloud-output
          cp arch/arm64/boot/Image cloud-output/Image
          sha256sum cloud-output/Image

      - name: Download pinned BOARD-qualified target-files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-inputs
          gh release download "$TARGET_FILES_TAG" --repo "$GITHUB_REPOSITORY" --dir cloud-inputs \
            -p opi5u-a14-baseline.zip
          echo '8120b75a1ed7461c42a9b227e5ff63a7ce5e8d21a7ad764cb0a0ee0fbf054367  cloud-inputs/opi5u-a14-baseline.zip' | sha256sum --check
          unzip -tq cloud-inputs/opi5u-a14-baseline.zip

      - name: Restore checksum-pinned AOSP OTA tools cache
        id: otatools-cache
        uses: actions/cache@v5
        with:
          path: |
            cloud-inputs/otatools.zip
            otatools
          key: ${{ runner.os }}-opi5u-a14-otatools-${{ env.OTA_TOOLS_SHA256 }}

      - name: Install checksum-pinned official AOSP OTA tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OTA_TOOLS_URL" == https://* ]]
          [[ "$OTA_TOOLS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir -p cloud-inputs otatools
          if [[ "${{ steps.otatools-cache.outputs.cache-hit }}" != "true" ]]; then
            curl --fail --location --retry 3 "$OTA_TOOLS_URL" --output cloud-inputs/otatools.zip
            unzip -q cloud-inputs/otatools.zip -d otatools
          fi
          echo "$OTA_TOOLS_SHA256  cloud-inputs/otatools.zip" | sha256sum --check
          test -x otatools/bin/ota_from_target_files
          test -x otatools/bin/mkbootimg
          echo "$GITHUB_WORKSPACE/otatools/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/otatools/lib64" >> "$GITHUB_ENV"

      - name: Restore original BOARD-qualified A14 OTA signing keys
        shell: bash
        env:
          OTA_PK8_BASE64: ${{ secrets.OPI5U_A14_OTA_PK8_B64 }}
          OTA_CERT_BASE64: ${{ secrets.OPI5U_A14_OTA_CERT_B64 }}
        run: |
          set -euo pipefail
          test -n "$OTA_PK8_BASE64"
          test -n "$OTA_CERT_BASE64"
          SIGNING_DIR=build/make/target/product/security
          mkdir -p "$SIGNING_DIR"
          umask 077
          printf '%s' "$OTA_PK8_BASE64" | base64 --decode > "$SIGNING_DIR/testkey.pk8"
          printf '%s' "$OTA_CERT_BASE64" | base64 --decode > "$SIGNING_DIR/testkey.x509.pem"

          EXPECTED_CERT_SHA256=cf2ab3818595c4eda08cec72bbe39bc377a30b764a3eebde52536eae01808525
          ACTUAL_CERT_SHA256="$(openssl x509 -in "$SIGNING_DIR/testkey.x509.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          openssl pkcs8 -inform DER -nocrypt -in "$SIGNING_DIR/testkey.pk8" -out /dev/null
          KEY_PUB_SHA256="$(openssl pkey -inform DER -in "$SIGNING_DIR/testkey.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_PUB_SHA256="$(openssl x509 -in "$SIGNING_DIR/testkey.x509.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_PUB_SHA256" = "$CERT_PUB_SHA256"
          echo "Original A14 signing pair verified; certificate SHA256: $ACTUAL_CERT_SHA256"

      - name: Reproduce baseline boot and package updated Image
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/opi5u-a14/repack_boot.py \
            --baseline cloud-inputs/opi5u-a14-baseline.zip \
            --kernel cloud-output/Image \
            --mkbootimg otatools/bin/mkbootimg \
            --output-boot cloud-output/boot.img \
            --output-target-files cloud-output/target-files.zip

      - name: Sign native partial A/B boot OTA
        shell: bash
        run: |
          set -euo pipefail
          ota_from_target_files -v --partial boot \
            cloud-output/target-files.zip cloud-output/opi5u-a14-boot-only.zip
          unzip -tq cloud-output/opi5u-a14-boot-only.zip
          unzip -p cloud-output/opi5u-a14-boot-only.zip META-INF/com/android/metadata |
            grep -qx 'ota-type=AB'
          unzip -p cloud-output/opi5u-a14-boot-only.zip META-INF/com/android/metadata |
            grep -qx 'pre-device=opi'
          sha256sum cloud-output/boot.img cloud-output/opi5u-a14-boot-only.zip

      - name: Publish signed OTA in established single-archive release format
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s kernelversion)"
          KSU_VERSION="$(git -C KernelSU-Next describe --tags --always)"
          echo "Releasing kernel $VERSION with KernelSU Next $KSU_VERSION"
          STAMP="$(date -u +'%d-%m-%Y_%H-%M-%S')"
          NAME="RK3588-Kernel-v${VERSION}_opi5u_KSUNext-${KSU_VERSION}_${STAMP}"
          TAG="opi5u-a14-rkr8-${NAME}"
          ZIP="${NAME}.zip"
          ARCHIVE="${NAME}.tar.xz"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; will not overwrite" >&2
            exit 1
          fi

          mkdir -p package
          cp cloud-output/opi5u-a14-boot-only.zip "package/$ZIP"
          OTA_SHA="$(sha256sum "package/$ZIP" | cut -d' ' -f1)"
          tar -C package -cf - "$ZIP" | xz -0 -T1 > "$ARCHIVE"
          test "$(tar -tf "$ARCHIVE")" = "$ZIP"
          test "$(tar -xOf "$ARCHIVE" "$ZIP" | sha256sum | cut -d' ' -f1)" = "$OTA_SHA"

          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "RK3588 Kernel $VERSION | KernelSU Next $KSU_VERSION | opi5u A14" \
            --notes "Orange Pi 5 Ultra / Android 14 rkr8. HOST PASS; BOARD validation pending. Extract the .tar.xz for the signed OTA ZIP." \
            --prerelease

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isPrerelease,assets,url
